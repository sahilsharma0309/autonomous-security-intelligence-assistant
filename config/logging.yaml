version: 1
disable_existing_loggers: false

formatters:
  default:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    formatter: default
    level: INFO
  file:
    class: logging.handlers.RotatingFileHandler
    formatter: default
    filename: logs/assistant.log
    maxBytes: 5242880
    backupCount: 3
    level: DEBUG

root:
  level: DEBUG
  handlers: [console, file]
