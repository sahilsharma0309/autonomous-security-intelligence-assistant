name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run; main is never
# cancelled so its history of green commits stays complete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tooling
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check src/ tests/ --output-format=github

      # Formatting is now a gate. The whole tree was formatted in the same
      # change that added this step, so it starts and stays clean.
      - name: ruff format --check
        run: ruff format --check src/ tests/

  typecheck:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tooling
        run: pip install -r requirements-dev.txt

      # Strict mode is configured in pyproject.toml; passing --strict here as
      # well makes the gate explicit and independent of that file drifting.
      - name: mypy
        run: mypy --strict src/

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tooling
        run: pip install -r requirements-dev.txt

      # No feature extras are installed on purpose: the engine and every
      # module must import and pass their tests on a bare interpreter, with
      # all network I/O injected. If a test needs Shodan or dnspython to run,
      # that is the bug this job is meant to catch.
      - name: pytest
        run: pytest tests/ -q --cov=security_assistant --cov-report=term-missing

  # A single required status check, so branch protection needs one entry
  # rather than being re-pointed every time the matrix changes.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    if: always()
    steps:
      - name: Verify all gates passed
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "typecheck=${{ needs.typecheck.result }}"
          echo "test=${{ needs.test.result }}"
          if [ "${{ needs.lint.result }}" != "success" ] \
            || [ "${{ needs.typecheck.result }}" != "success" ] \
            || [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::One or more CI gates failed"
            exit 1
          fi
          echo "All gates passed."
