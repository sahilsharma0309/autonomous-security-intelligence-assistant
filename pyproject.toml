[tool.poetry]
name = "autonomous-security-intelligence-assistant"
version = "0.1.0"
description = "Autonomous Security & Intelligence Assistant: OSINT, IoT recon, threat scanning, and network/VPN orchestration for authorized security assessments."
authors = ["Sahil Sharma <sahilvashisth27@gmail.com>"]
readme = "README.md"
packages = [{ include = "security_assistant", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
pyyaml = "^6.0"
requests = "^2.32"
python-dotenv = "^1.0"
pydantic = "^2.8"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^5.0"
ruff = "^0.6"
mypy = "^1.11"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
